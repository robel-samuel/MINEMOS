name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run test suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-nli-distilroberta-minilm-l6-v2

      - name: Install CPU-only PyTorch
        run: |
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install -r requirements.txt

      - name: Download required Hugging Face models
        run: |
          python - <<'EOF'
          from transformers import AutoTokenizer, AutoModelForSequenceClassification, AutoModel
          print("Downloading cross-encoder/nli-distilroberta-base ...")
          AutoTokenizer.from_pretrained("cross-encoder/nli-distilroberta-base")
          AutoModelForSequenceClassification.from_pretrained("cross-encoder/nli-distilroberta-base")
          print("Downloading sentence-transformers/all-MiniLM-L6-v2 ...")
          AutoTokenizer.from_pretrained("sentence-transformers/all-MiniLM-L6-v2")
          AutoModel.from_pretrained("sentence-transformers/all-MiniLM-L6-v2")
          print("Models downloaded.")
          EOF

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
