name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run test suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-models-nli-distilroberta-minilm-l6-v2

      - name: Install CPU-only PyTorch
        run: |
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install MINEMOS with test and Qdrant extras
        run: |
          pip install -e ".[qdrant,test]"

      # The suite provisions both models on first use; no pre-download step is
      # needed, and this exercises the same code path an installed user runs.
      # The install job below separately proves the cold-cache path with an
      # empty HF_HOME.

      - name: Run dependency vulnerability audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit -s osv -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu --desc

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

  install:
    name: Clean install acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel in a clean environment and verify it
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Exercise the documented CPU-only path: the CPU wheel is
            # installed first and must satisfy the declared torch==2.14.0.
            python scripts/install_acceptance.py \
              --wheel dist/*.whl \
              --cpu-torch \
              --repo-root "$GITHUB_WORKSPACE" \
              --evidence-dir "$RUNNER_TEMP/evidence"
          else
            python scripts/install_acceptance.py \
              --wheel dist/*.whl \
              --repo-root "$GITHUB_WORKSPACE" \
              --evidence-dir "$RUNNER_TEMP/evidence"
          fi

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
