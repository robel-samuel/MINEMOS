name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify artifact names and package version
        run: |
          python - <<'PY'
          import glob
          import os
          import sys
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          expected = {f"minemos-{version}.tar.gz", f"minemos-{version}-py3-none-any.whl"}
          found = {os.path.basename(path) for path in glob.glob("dist/*")}
          if found != expected:
              sys.exit(
                  f"unexpected distributions: missing={sorted(expected - found)} "
                  f"extra={sorted(found - expected)}"
              )
          print("built:", ", ".join(sorted(found)))
          PY

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in (version, f"v{version}"):
              sys.exit(f"release tag {tag!r} does not match package version {version!r}")
          print("release tag:", tag)
          PY

      - name: Check distribution metadata and README rendering
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: >-
      github.repository == 'robel-samuel/MINEMOS' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/minemos
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: >-
      github.repository == 'robel-samuel/MINEMOS' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.target == 'pypi'))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/minemos
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
